<!-- Outstanding Balances screen: the Outstanding balances and Waived payments sheets.
     Injected into index.html by js/screens.js before dashboard.js runs. -->

<!-- Waive Balance View -->
<div id="view-waive-balance" class="view" role="tabpanel" aria-labelledby="sheet-tab-balances">
  <div class="page-content waive-balance-page">
    <header class="balances-hero">
      <div class="balances-hero__lead" aria-live="polite">
        <h1 class="balances-hero__title">
          <span class="balances-hero__total" id="waiveBalancesHeroTotal">—</span>
        </h1>
        <p class="balances-hero__context" id="waiveBalancesHeroContext">Loading what is still owed.</p>
      </div>
    </header>

    <div class="waive-balance-layout">
      <section class="waive-balances-list-card" aria-label="Balances still owed">
        <div class="outstanding-filters waive-balances-filters">
          <label class="outstanding-search" for="waiveBalancesSearch">
            <span class="material-symbols-outlined" aria-hidden="true">search</span>
            <input id="waiveBalancesSearch" type="search" placeholder="Name, house, or phone" autocomplete="off">
          </label>
          <div class="waive-kind-filter" role="group" aria-label="Filter by category">
            <button type="button" class="waive-kind-filter__btn is-active" data-kind="all" aria-pressed="true">All</button>
            <button type="button" class="waive-kind-filter__btn" data-kind="rent" aria-pressed="false">Rent</button>
            <button type="button" class="waive-kind-filter__btn" data-kind="deposit" aria-pressed="false">Deposit</button>
          </div>
        </div>

        <div class="waive-balance-head" id="waiveBalancesHead" hidden></div>
        <div class="waive-balance-list" id="waiveBalancesList"></div>

        <footer class="outstanding-report-card__footer" hidden>
          <span id="waiveBalancesTableCount"></span>
        </footer>
      </section>

      <div class="waive-balance-detail" aria-hidden="true">
        <article class="card payment-form-card waive-balance-form-card">
          <div class="waive-balance-form-empty" id="waiveBalanceFormEmpty">
            <p class="waive-balance-form-empty__title">No tenant selected</p>
            <p>Choose someone from the list to see the months they still owe.</p>
          </div>

          <div class="waive-balance-stage" id="waiveBalanceStage" hidden>
            <div class="waive-balance-stage__top">
              <h2 class="waive-selection" id="waiveSelectionLine"></h2>
              <button type="button" class="waive-balance-close" id="waiveBalanceClose" aria-label="Close">
                <span class="material-symbols-outlined" aria-hidden="true">close</span>
              </button>
            </div>
            <div class="waive-balance-stage__body">
              <section class="waive-balance-review" id="waiveBalanceReview" aria-labelledby="waiveSelectionLine">
                <p class="waive-period-kicker" id="waivePeriodKicker">Period owed</p>
                <ul class="waive-period-list" id="waivePeriodList"></ul>
                <div class="waive-balance-summary" id="waiveReviewSummary"></div>
                <div class="form-actions">
                  <button type="button" class="btn btn--primary" id="waiveBalanceStart">Waive balance</button>
                </div>
              </section>

          <form class="payment-form" id="waiveBalanceForm" aria-hidden="true" inert>
            <div class="waive-balance-summary" id="waiveBalanceSummary"></div>

            <p class="waive-deposit-note" id="waiveDepositNote" hidden>Unpaid security deposit only. Rent months stay as they are.</p>

            <div class="form-group" id="waiveRentMonthField">
              <label class="form-label" id="waiveRentMonthLabel">Rent months</label>
              <div class="multi-select" id="waiveRentMonthSelect">
                <button type="button" class="multi-select__trigger" id="waiveRentMonthTrigger" aria-haspopup="listbox" aria-expanded="false" aria-labelledby="waiveRentMonthLabel waiveRentMonthDisplay" disabled>
                  <span class="multi-select__value" id="waiveRentMonthDisplay">Select rent months</span>
                  <span class="material-symbols-outlined icon icon--select">expand_more</span>
                </button>
                <input type="hidden" id="waiveRentMonth" value="">
                <div class="multi-select__menu" id="waiveRentMonthMenu" hidden></div>
              </div>
            </div>

            <div class="form-group">
              <label class="form-label" for="waiveAmount">Amount to waive (UGX)</label>
              <input type="text" id="waiveAmount" class="form-input form-input--readonly" value="0" readonly tabindex="-1" aria-readonly="true">
            </div>

            <div class="form-group">
              <label class="form-label" for="waiveReason">Reason <span class="form-label__required" aria-hidden="true">*</span></label>
              <textarea id="waiveReason" class="form-input form-textarea" rows="2" required placeholder="Why this balance is being waived"></textarea>
            </div>

            <div class="form-group">
              <label class="form-label" for="waiveApprovedBy">Approved by</label>
              <input type="text" id="waiveApprovedBy" class="form-input form-input--readonly" value="" readonly tabindex="-1" aria-readonly="true">
            </div>

            <div class="form-actions">
              <button type="button" class="btn btn--outline" id="waiveBalanceCancel">Cancel</button>
              <button type="submit" class="btn btn--primary" id="waiveBalanceSubmit" disabled>Waive balance</button>
            </div>
          </form>
            </div>
          </div>
        </article>
      </div>
    </div>
  </div>
</div>

<!-- Waived Payments View -->
<div id="view-waived-payments" class="view" role="tabpanel" aria-labelledby="sheet-tab-waived">
  <div class="page-content outstanding-page waived-payments-page">
    <header class="balances-hero">
      <div class="balances-hero__lead" aria-live="polite">
        <h1 class="balances-hero__title">
          <span class="balances-hero__total" id="waivedPaymentsTotal">UGX 0</span>
        </h1>
        <p class="balances-hero__context" id="waivedPaymentsContext">No waived payments yet.</p>
      </div>
    </header>

    <div class="waive-balance-layout" id="waivedPaymentsLayout">
      <section class="waive-balances-list-card waived-payments-card" aria-label="Waived payments">
        <div class="outstanding-filters waive-balances-filters waived-payments-filters">
          <label class="outstanding-search" for="waivedPaymentsSearch">
            <span class="material-symbols-outlined" aria-hidden="true">search</span>
            <input id="waivedPaymentsSearch" type="search" placeholder="Name, house, or reason" autocomplete="off">
          </label>
          <div class="waive-kind-filter" id="waivedKindFilter" role="group" aria-label="Filter by category">
            <button type="button" class="waive-kind-filter__btn is-active" data-kind="all" aria-pressed="true">All</button>
            <button type="button" class="waive-kind-filter__btn" data-kind="rent" aria-pressed="false">Rent</button>
            <button type="button" class="waive-kind-filter__btn" data-kind="deposit" aria-pressed="false">Deposit</button>
          </div>
        </div>

        <div class="waive-balance-head" id="waivedPaymentsHead" hidden></div>
        <div class="waive-balance-list" id="waivedPaymentsList"></div>

        <footer class="outstanding-report-card__footer">
          <span id="waivedPaymentsTableCount">Showing 0 waived payments</span>
        </footer>
      </section>

      <div class="waive-balance-detail" id="waivedPaymentsDetail" aria-hidden="true">
        <article class="card payment-form-card waive-balance-form-card">
          <div class="waive-balance-stage">
            <div class="waive-balance-stage__top">
              <div>
                <h2 class="waive-selection" id="waivedDetailTitle"></h2>
                <p class="waived-detail-meta" id="waivedDetailMeta"></p>
              </div>
              <button type="button" class="waive-balance-close" id="waivedDetailClose" aria-label="Close">
                <span class="material-symbols-outlined" aria-hidden="true">close</span>
              </button>
            </div>
            <div class="waive-balance-stage__body">
              <section class="waive-balance-review" aria-labelledby="waivedDetailTitle">
                <p class="waive-period-kicker" id="waivedDetailKicker"></p>
                <ul class="waive-period-list" id="waivedDetailLines"></ul>
                <p class="waived-detail-reason" id="waivedDetailReason" hidden></p>
                <div class="waive-owed" id="waivedDetailTotal"></div>
                <div class="waive-balance-summary" id="waivedDetailSummary"></div>
                <p class="waived-detail-edit-note" id="waivedDetailEditNote" hidden></p>
                <div class="form-actions waived-detail-actions" id="waivedDetailActions" hidden>
                  <button type="button" class="btn btn--outline" id="waivedDetailEdit">Edit waiver</button>
                </div>
                <div class="form-actions waived-detail-actions" id="waivedDetailEditActions" hidden>
                  <button type="button" class="btn btn--outline" id="waivedDetailCancel">Cancel</button>
                  <button type="button" class="btn btn--primary" id="waivedDetailSave" disabled>Save</button>
                </div>
              </section>
            </div>
          </div>
        </article>
      </div>
    </div>
  </div>
</div>
